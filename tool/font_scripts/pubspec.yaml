name: font_script
description: "Script to update SBB icon fonts from the sbb-icons GitHub repository"
version: 0.0.1

environment:
  sdk: ">=3.9.0 <5.0.0"

dependencies:
  # https://pub.dev/packages/http
  http: ^1.4.0
  # https://pub.dev/packages/dart_style
  dart_style: ^3.1.0
  # https://pub.dev/packages/version
  version: ^3.0.2
  # https://pub.dev/packages/archive
  archive: ^4.7.0

dev_dependencies:
  # https://pub.dev/packages/flutter_lints
  flutter_lints: ^6.0.0
  # https://pub.dev/packages/test
  test: ^1.33.0
