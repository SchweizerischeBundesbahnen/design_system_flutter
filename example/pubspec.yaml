name: "flutter_design_system_mobile_example"
description: A showcase app for the flutter design system mobile from SBB.
version: 5.2.0+20010424 # automatically set by GH Action 
publish_to: "none"

environment:
  sdk: '^3.13.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # https://pub.dev/packages/provider
  provider: ^6.1.5+1
  # https://pub.dev/packages/animations
  animations: ^3.0.0
  # https://pub.dev/packages/flutter_svg
  flutter_svg: ^2.4.0
  # https://pub.dev/packages/intl
  intl: ^0.20.3
  # https://pub.dev/packages/material_ui
  material_ui: ^1.11.0
  # https://pub.dev/packages/cupertino_ui
  cupertino_ui: ^1.1.6

  sbb_design_system_mobile:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # https://pub.dev/packages/flutter_lints
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
