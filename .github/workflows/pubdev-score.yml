# Calculates the pana score of the package and writes the report to the job summary.

name: pubdev_score

on:
  push:
    branches:
      - main

jobs:
  scoring:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.x
          cache: true

      - name: Install pana
        run: dart pub global activate pana

      - name: Run pana
        run: dart pub global run pana --no-warning . | tee -a "$GITHUB_STEP_SUMMARY"
